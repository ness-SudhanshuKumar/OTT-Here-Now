spring:
  application:
    name: report-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/reports_db?useSSl=false&allowPublicKeyRetrieval=true&serverTimeZone=IST
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: report_user
    password: report_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8082

eureka:
  client:
    ServiceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    appName: report-service
    preferIpAddress: true
